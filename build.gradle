plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'me.modmuss50.mod-publish-plugin' version "${mod_publish_plugin_version}"
}

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven {
        name = 'PaperMC'
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
}

loom {
    mods {
        "origami" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    // バージョンは gradle.properties を参照。26.x は難読化なしのためマッピング指定は不要。
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

// --- paper-api ---
// Loom の include は推移的依存を同梱しない。そのため同梱物は明示リストで管理する。
//   compileOnly : paper-api (推移的依存あり)。コンパイル時に adventure などの型が見える必要がある
//   runtimeOnly : runClient など開発実行用。transitive=false + 明示リスト (本番 jar と同じ中身にする)
//   include     : 本番 jar への jar-in-jar 同梱。transitive=false + 明示リスト
// MC 本体が同一バージョンで持つライブラリ (guava, gson, brigadier, fastutil, joml, log4j-api,
// slf4j-api, jspecify) は同梱しない。MC 側のものを使う。
// paper_api_version を上げたときは、次の手順で明示リストを見直すこと:
//   ./gradlew dependencies --configuration compileClasspath
//   ここに無い net.kyori / net.md-5 / org.yaml 系が増えていたら追加する
def paperApi = "io.papermc.paper:paper-api:${project.paper_api_version}"

def paperBundledLibs = [
        paperApi,
        "net.kyori:adventure-api:${project.adventure_version}",
        "net.kyori:adventure-key:${project.adventure_version}",
        "net.kyori:adventure-text-minimessage:${project.adventure_version}",
        "net.kyori:adventure-text-serializer-gson:${project.adventure_version}",
        "net.kyori:adventure-text-serializer-json:${project.adventure_version}",
        "net.kyori:adventure-text-serializer-legacy:${project.adventure_version}",
        "net.kyori:adventure-text-serializer-plain:${project.adventure_version}",
        "net.kyori:adventure-text-logger-slf4j:${project.adventure_version}",
        "net.kyori:option:${project.kyori_option_version}",
        "net.md-5:bungeecord-chat:${project.bungeecord_chat_version}",
        "org.yaml:snakeyaml:${project.snakeyaml_version}",
]

def paperCompileExcludeGroups = [
        'com.google.guava', 'com.google.code.gson', 'com.mojang', 'it.unimi.dsi', 'org.joml',
        'org.apache.logging.log4j', 'org.slf4j', 'org.jspecify',
        'org.checkerframework',                           // アノテーションのみ
        'org.apache.maven', 'org.apache.maven.resolver',  // plugin.yml の libraries: 解決用。Origami では使わない
]

project.dependencies.add('compileOnly', paperApi) { dep ->
    paperCompileExcludeGroups.each { g -> dep.exclude(group: g) }
}
['runtimeOnly', 'include'].each { cfg ->
    paperBundledLibs.each { coord ->
        project.dependencies.add(cfg, coord) { dep -> dep.transitive = false }
    }
}

// --- gametest (ローカル専用) ---
// src/gametest が無い環境 (CI など) では何もしない。src/gametest は .gitignore 済み。
// eula = true: ユーザーが Minecraft EULA (https://aka.ms/MinecraftEULA) に同意済み。
if (file('src/gametest').exists()) {
    fabricApi {
        configureTests {
            createSourceSet = true
            modId = "origami-gametest"
            enableGameTests = true
            enableClientGameTests = false
            eula = true
        }
    }
    // テスト用プラグイン (test.gt.*) を jar にして、runGameTest のプラグインフォルダへ置く
    tasks.register('gametestPluginJar', Jar) {
        archiveFileName = 'OrigamiGT.jar'
        destinationDirectory = layout.buildDirectory.dir('run/gameTest/plugins')
        from(sourceSets.gametest.output.classesDirs) { include 'test/gt/**' }
        from('src/gametest/plugin') { include 'plugin.yml' }
        dependsOn tasks.named('gametestClasses')
    }
    tasks.matching { it.name == 'runGameTest' }.configureEach {
        dependsOn tasks.named('gametestPluginJar')
    }

    // テストコードから org.bukkit.* を参照するため、main と同じ除外条件で compileOnly に足す
    project.dependencies.add('gametestCompileOnly', paperApi) { dep ->
        paperCompileExcludeGroups.each { g -> dep.exclude(group: g) }
    }
}

processResources {
    def modVersion = project.version.toString()
    inputs.property "version", modVersion

    filesMatching("fabric.mod.json") {
        expand "version": modVersion
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.encoding = 'UTF-8'
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

// CI から -Prelease_tag=v1.0.0 が渡された場合は、jar 名の末尾にそのまま付ける
tasks.withType(Jar).configureEach {
    archiveVersion = providers.gradleProperty('release_tag').orElse(project.version.toString())
}

jar {
    from("THIRD_PARTY_NOTICES.md") {
        rename { "THIRD_PARTY_NOTICES_${project.archives_base_name}.md" }
    }
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

// --- 公開 (Modrinth / CurseForge)。手元から ./gradlew publishMods で実行する ---
// ・既定は dry run (何も送信せず、公開物を build 配下に保存するだけ)
// ・実際に送るのは -PorigamiPublish=true を付けたときだけ
// ・トークンと ID は ~/.gradle/gradle.properties (リポジトリの外) から読む。このファイルには値を書かない
//     origami_modrinth_token / origami_modrinth_id / origami_curseforge_token / origami_curseforge_id
// ・トークンを -P で渡さない (シェルの履歴に残る)。--debug や --scan は使わない
def origamiPublish = providers.gradleProperty('origamiPublish').map { it == 'true' }.orElse(false)
def mrToken = providers.gradleProperty('origami_modrinth_token').orElse('')
def mrId = providers.gradleProperty('origami_modrinth_id').orElse('')
def cfToken = providers.gradleProperty('origami_curseforge_token').orElse('')
def cfId = providers.gradleProperty('origami_curseforge_id').orElse('')
// dry run でもプラグインが空の値を嫌がる場合に備えた仮の値 (実際の送信では使われない)
def mrTokenOrDry = providers.gradleProperty('origami_modrinth_token').filter { !it.isBlank() }.orElse('DRYRUN')
def cfTokenOrDry = providers.gradleProperty('origami_curseforge_token').filter { !it.isBlank() }.orElse('DRYRUN')

publishMods {
    file = jar.archiveFile
    changelog = providers.fileContents(layout.projectDirectory.file('RELEASE_NOTES.md')).asText
    type = ALPHA
    displayName = "Origami ${project.version}"
    modLoaders.add('fabric')
    dryRun = origamiPublish.map { !it }

    modrinth {
        accessToken = mrTokenOrDry
        projectId = mrId.map { it.isBlank() ? 'DRYRUN' : it }
        // 専用サーバーとシングルプレイで動き、サーバーに参加するだけのクライアントには不要 (Modrinth の server_only)
        environment = SERVER_ONLY
        minecraftVersions.add(project.property('minecraft_version').toString())
        requires('fabric-api')
    }
    curseforge {
        accessToken = cfTokenOrDry
        projectId = cfId.map { it.isBlank() ? '0' : it }
        minecraftVersions.add(project.property('minecraft_version').toString())
        server = true
        requires('fabric-api')
    }
}

// 送信を有効にしたのに設定が足りないときは、値を出さずに止める
gradle.taskGraph.whenReady { graph ->
    if (origamiPublish.get() && graph.allTasks.any { it.name == 'publishMods' }) {
        def missing = []
        if (mrToken.get().isBlank()) missing << 'origami_modrinth_token'
        if (mrId.get().isBlank()) missing << 'origami_modrinth_id'
        if (cfToken.get().isBlank()) missing << 'origami_curseforge_token'
        if (cfId.get().isBlank()) missing << 'origami_curseforge_id'
        if (!missing.isEmpty()) {
            throw new GradleException('Publishing is enabled but these are not set in ~/.gradle/gradle.properties: ' + missing.join(', '))
        }
    }
}
